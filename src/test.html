<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Plyr</title>

    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        body {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .player-wrapper {
            resize: both;
            overflow: auto;
            width: 700px;
            max-width: 100%;
            border: 1px solid #ddd;
            padding: 10px;
        }

        video {
            width: 100%;
        }

        .controls {
            margin-bottom: 15px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Test Plyr</h1>

<div class="controls">
    <button id="back">⏪ -5 sec</button>
    <button id="forward">⏩ +5 sec</button>
</div>

<div class="player-wrapper">
    <video id="player" playsinline controls>
        <source src="/assets/video.mp4" type="video/mp4">
    </video>
</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>
    const player = new Plyr('#player');

    player.on('ready', () => {
        const controls = player.elements.controls;

        const backBtn = document.createElement('button');
        backBtn.className = 'plyr__control';
        backBtn.innerHTML = '- 5s';

        backBtn.addEventListener('click', () => {
            player.currentTime -= 5;
        });

        const forwardBtn = document.createElement('button');
        forwardBtn.className = 'plyr__control';
        forwardBtn.innerHTML = '+ 5s';

        forwardBtn.addEventListener('click', () => {
            player.currentTime += 5;
        });

        controls.prepend(backBtn);
        controls.prepend(forwardBtn);
    });
</script>

</body>
</html>
